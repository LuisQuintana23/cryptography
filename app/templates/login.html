{% extends "base.html" %}

{% block title %}Iniciar Sesión - Proyecto Vault{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-12 col-md-8 col-lg-5">
        
        <div class="card bg-dark border-secondary shadow-lg">
            
            <div class="card-header border-secondary text-center py-4">
                <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
                <h3 class="mb-0 mt-2 fw-bold">Acceso a la Bóveda</h3>
                <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
            </div>

            <div class="card-body p-4">
                
                {% if error %}
                    <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <div>{{ error }}</div>
                    </div>
                {% endif %}

                <form method="POST" action="{{ url_for('main.login') }}">
                    
                    <div class="mb-4">
                        <label for="username" class="form-label text-light">Usuario</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-secondary text-light">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text" class="form-control bg-dark border-secondary text-light" id="username" name="username" placeholder="Tu nombre de usuario" required autofocus>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-light">Contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-secondary text-light">
                                <i class="bi bi-key-fill"></i>
                            </span>
                            <input type="password" class="form-control bg-dark border-secondary text-light" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg d-flex align-items-center justify-content-center gap-2 shadow-sm">
                            <i class="bi bi-box-arrow-in-right"></i> Entrar a la Bóveda
                        </button>
                    </div>
                </form>

            </div>
            
            <div class="card-footer border-secondary text-center py-3">
                <p class="mb-0 text-muted small">
                    ¿No tienes una cuenta? <a href="#" class="text-info text-decoration-none">Regístrate aquí</a>
                </p>
            </div>
        </div>

    </div>
</div>
{% endblock %}
